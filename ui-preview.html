<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UI preview — По течению веков</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #dfe9ee;
        overflow: hidden;
      }
      #map {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #views {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        font: 12px system-ui, sans-serif;
      }
      #views a {
        padding: 3px 7px;
        border-radius: 3px;
        background: rgb(255 255 255 / 0.8);
        color: #333;
        text-decoration: none;
      }
      body.shot #views {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <nav id="views"></nav>
    <script type="module" src="/src/ui/preview.ts"></script>
  </body>
</html>
